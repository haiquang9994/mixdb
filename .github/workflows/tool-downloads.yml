# Checks that the database tools MixDB downloads for itself are still downloadable, still hash to
# what the code pins, and still run — on a real machine of every kind the app ships for.
#
# This is the one thing the unit tests cannot answer. `mysqldump`, `pg_dump` and `mongodump` are
# fetched from the vendor and run as separate programs, so what breaks them is a URL withdrawn, an
# archive rebuilt under the same name, or a library that the download did not bring along on this
# particular operating system. None of that shows up when compiling, and none of it can be checked
# from another platform.
#
# It does not run on ordinary pushes: each job downloads hundreds of megabytes from a vendor, and
# nothing about an average change can affect the outcome. Run it when you have reason to:
#
#   - **Bumping a pinned version.** See `.agent/conventions/bumping-tool-downloads.md`; this
#     workflow is the "verify" step of that procedure.
#   - **Before a release**, if the pins have not been exercised in a while — a vendor can withdraw
#     a file without anyone touching this repository.
#   - **Whenever `src-tauri/src/modules/db/drivers/tools.rs` changes** in a way that affects what is
#     copied out of an archive.
#
# Two ways to start it: press "Run workflow" on the Actions tab, or push to the `ci/tool-downloads`
# branch, which exists for exactly this and is never merged. Working on the pins on a feature
# branch, the usual move is:
#
#   git push --force origin HEAD:ci/tool-downloads
#
# A job that says "no archive for this platform" passed correctly: not every suite is published for
# every platform, and the test treats the vendor's answer as the expected one. Which platform gets
# which download is `archive_source` in `src-tauri/src/modules/db/drivers/tools.rs`.

name: Tool downloads

on:
  workflow_dispatch:
  push:
    branches:
      - ci/tool-downloads

jobs:
  download:
    strategy:
      # A suite broken on one platform says nothing about the others, and the whole point of this
      # workflow is to learn which platforms are affected — so every job runs to the end.
      fail-fast: false
      matrix:
        include:
          # Apple Silicon.
          - platform: macos-latest
          # Intel. A separate job rather than a second architecture of the same one: these
          # downloads are per-architecture builds, and Rosetta would hide a wrong one being picked.
          #
          # `macos-15-intel` rather than the `macos-13` that used to serve this: that image was
          # retired in December 2025, and a job asking for it is never given a runner — it queues
          # until something cancels it rather than failing. This label is the last x86-64 image
          # GitHub will publish and goes the same way in August 2027, after which the Intel half of
          # the universal bundle release.yml builds has no machine here to be tried on.
          - platform: macos-15-intel
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # The tests live in the app's own crate, so building them builds everything it links
      # against — which on Linux means the GTK and WebKit that Tauri wants. Kept to what the
      # compile needs; this workflow never bundles anything.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"
          key: tool-downloads-${{ matrix.platform }}

      # `--include-ignored` rather than `--ignored`: the ordinary tests in this module are quick,
      # they cover the layout the downloaded files are put into, and a failure in one of those
      # explains a failure in the download tests standing next to it.
      #
      # Filtered to this one module so the rest of the suite's failures cannot be mistaken for a
      # broken download — this workflow answers one question and should not report on any other.
      #
      # The filter is counted before it is trusted. `cargo test` treats one that matches nothing as
      # a run of no tests and exits 0, which is how this workflow spent its whole life passing
      # without downloading anything: it said `db::tools`, and the module is
      # `modules::db::drivers::tools`. A green tick meaning "nothing was checked" is worse than no
      # workflow, so the three tests this exists for are counted by name first.
      #
      # `shell: bash` for all four platforms: the Windows runner's default is PowerShell, and Git
      # Bash is there on every image.
      - name: Download, unpack and run the pinned tools
        working-directory: ./src-tauri
        shell: bash
        env:
          FILTER: modules::db::drivers::tools
        run: |
          listed=$(cargo test --lib "$FILTER" -- --include-ignored --list)
          echo "$listed"
          downloads=$(echo "$listed" | grep -c '_download_still_installs_and_runs: test' || true)
          if [ "$downloads" -lt 3 ]; then
            echo "::error::'$FILTER' matched $downloads download tests, expected one per suite. The module was renamed or moved; fix the filter rather than this check."
            exit 1
          fi
          cargo test --lib "$FILTER" -- --include-ignored --nocapture
